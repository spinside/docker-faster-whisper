name: Mark stale issues and pull requests
on:
  schedule:
    - cron:  '46 10 * * *'
  workflow_dispatch:

jobs:
  stale:
    if: github.repository_owner == 'linuxserver'  # lsio-infra: fork lacks the org secrets this workflow needs; only meaningful in the upstream org
    permissions:
      issues: write
      pull-requests: write
    uses: linuxserver/github-workflows/.github/workflows/issues-cron.yml@v1
    secrets: inherit
